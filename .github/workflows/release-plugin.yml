name: Production Release Zip

on:
  release:
    types: [published] # Only run after you manually publish a Release in GitHub

permissions:
  contents: write

jobs:
  release-plugin:
    name: Release Plugin Zip
    runs-on: ubuntu-22.04
    if: github.event.release.target_commitish == 'main' # Only run if the release is based on the 'main' branch

    steps:
      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4
          extensions: mbstring, intl, pdo, bcmath, tokenizer, xml, curl, json
          ini-values: |
            memory_limit=3G
          tools: composer

      - name: Check out code
        uses: actions/checkout@v4

      # Extract the release tag (e.g. "v2.4.5") and store it in GITHUB_ENV
      - name: Set PLUGIN_VERSION from release tag
        run: |
          # e.g. if the release tag is "v2.4.5", remove the "v"
          TAG_NAME="${{ github.event.release.tag_name }}"
          PLUGIN_VERSION="${TAG_NAME#v}"  # removes leading "v" if present
          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> $GITHUB_ENV

      - name: Show derived version
        run: echo "Derived plugin version = $PLUGIN_VERSION"

      # OPTIONAL: Update package.json version from the release tag
      - name: Update package.json version
        run: |
          jq ".version = \"$PLUGIN_VERSION\"" package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Plugin Zip
        run: |
          npm run build-admin
          npm run build

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: build/shazzad-wp-logs.v${{ env.PLUGIN_VERSION }}.zip
          asset_name: shazzad-wp-logs.v${{ env.PLUGIN_VERSION }}.zip
          asset_content_type: application/zip
